<div class="row transfer-ownership">

  <div class="col-md-12 current-owner" data-ng-show="userGroupDefined && bucket === 'null'">
    <div class="row">
      <div class="col-md-1">
        <strong>{{'transferFrom' | translate}}:</strong>
      </div>

      <div class="col-md-11" ng-show="currentOwner().userName">
        <span>{{currentOwner().userName}}</span>
      </div>

      <div class="col-md-11" ng-hide="currentOwner().userName">
        <span><i>{{'noUserDetailsAvailable' | translate}}</i></span>
      </div>
    </div>
  </div>

  <div class="col-md-12">
    <div class="row">
      <div class="col-md-1" style="margin-top: 5px" data-ng-show="userGroupDefined">
        <strong>{{'transferTo' | translate}}:</strong>
      </div>

      <div class="col-md-11" data-ng-show="userGroupDefined">
        <select class="form-control"
                data-ng-model="selectedUserGroup"
                data-ng-options="g.userName group by g.groupNameTranslated for (key, g) in userGroups">
        </select>
        <br/>
      </div>
    </div>
  </div>

  <div class="btn-toolbar col-md-12" data-ng-show="userGroupDefined">
    <button type="button"
            class="btn btn-primary pull-right"
            data-gn-click-and-spin="save()"
            data-ng-disabled="!selectedUserGroup">
      <i class="fa fa-save"></i>&nbsp
      <span data-translate=""
            class="ng-scope">Save</span>
    </button>
  </div>

  <div class="col-md-12" data-ng-show="!groupsLoaded">
    <p class="text-center">
      <i class="fa fa-spinner fa-spin fa-3x fa-fw"></i>
      <span class="sr-only">Loading...</span>
    </p>
  </div>
  <div class="col-md-12" data-ng-show="groupsLoaded && !userGroupDefined">
    <span data-translate="">noUsers</span>
  </div>
</div>
