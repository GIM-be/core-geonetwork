<div class="modal-dialog">
  <div class="modal-content">
    <div class="modal-header">
      <button type="button" class="close" data-dismiss="modal"
              ng-if="!options.hideCancelBtn"
              aria-hidden="true">&times;</button>
      <h4 class="modal-title" id="myModalLabel">
        <span data-translate="">{{options.title}}</span></h4>
    </div>
    <div class="modal-body" data-ng-transclude=""></div>
    <div class="modal-footer" ng-if="options.confirmCallback">
      <button data-dismiss="modal" class="btn" data-ng-class="{'btn-primary': !options.invertColors}"
        data-ng-click="options.confirmCallback()">
        {{options.confirmLabel ? options.confirmLabel : 'confirm' | translate}}
      </button>
      <button data-dismiss="modal" class="btn btn-default" data-ng-class="{'btn-primary': options.invertColors}" ng-if="!options.hideCancelBtn">
        {{options.cancelLabel ? options.cancelLabel : 'cancel' | translate}}
      </button>
    </div>
  </div>
</div>
