<div class="gn-search-filter col-lg-12 advancedSearchForm">
  <div class="row">
    <div class="col-md-5 col-md-offset-1">
      <h3 data-translate="">what</h3>
    </div>
  </div>
  <div class="row">
    <div class="col-md-5 col-md-offset-1">
      <!-- <h3 data-translate="">what</h3> -->
      <div class="form-group">
        <div class="col-sm-12">
          <label for="flanderskeywordF"
                 class="control-label">
            <span data-translate="" class="control-label-span">flanderskeywords</span>
            <input type="text" id="flanderskeywordF" value=""
                   class="form-control"
                   gn-values="searchObj.params.flanderskeyword"
                   gn-typeahead="flanderskeywordOptions"/>
          </label>
        </div>
      </div>
      <div class="form-group">
        <div class="col-sm-12">
          <label for="keywordsF"
                 class="control-label">
            <span data-translate="" class="control-label-span">keywords</span>
            <input type="text" id="keywordsF" value=""
                   class="form-control"
                   gn-values="searchObj.params.keyword"
                   gn-typeahead="keywordsOptions"/>
          </label>
        </div>
      </div>
      <div class="form-group">
        <div class="col-sm-12">
          <label for="fileIdF"
                 class="control-label">
            <span data-translate="" class="control-label-span">fileId</span>
            <input type="text" id="fileIdF" value=""
                   class="form-control"
                   gn-values="searchObj.params.fileId"
                   gn-typeahead="fileIdOptions"/>
          </label>
        </div>
      </div>

      <div ng-show="authenticated && user.isEditorOrMore()">
        <div class="form-group">
          <div class="col-sm-12">
            <label for="orgNameF"
                   class="control-label">
              <span data-translate="" class="control-label-span">orgName</span>
              <input type="text" id="orgNameF" value=""
                     class="form-control"
                     gn-values="searchObj.params.orgName"
                     gn-typeahead="orgNameOptions"/>
            </label>
          </div>
        </div>
        <div class="form-group">
          <div class="col-sm-12">
            <label for="typeF"
                   class="control-label">
              <span data-translate="" class="control-label-span">metadataTypes</span>
              <input type="text" id="typeF" value=""
                     class="form-control"
                     gn-values="searchObj.params.type"
                     gn-typeahead="typeOptions"/>
            </label>
          </div>
        </div>
        <div class="form-group">
          <div class="col-sm-12">
            <label for="categoriesF"
                   class="control-label">
              <span data-translate="" class="control-label-span">categories</span>
              <input type="text" id="categoriesF" value=""
                     class="form-control"
                     gn-typeahead="categoriesOptions"
                     gn-values="searchObj.params._cat"/>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-5 gn-search-filter-datepickers">
      <!-- <h3 data-translate="">when</h3> -->
      <div ng-hide="authenticated && user.isEditorOrMore()">
        <div class="form-group">
          <div class="col-sm-12">
            <label for="orgNameF2"
                   class="control-label">
              <span data-translate="" class="control-label-span">orgName</span>
              <input type="text" id="orgNameF2" value=""
                     class="form-control"
                     gn-values="searchObj.params.orgName"
                     gn-typeahead="orgNameOptions"/>
            </label>
          </div>
        </div>
        <div class="form-group">
          <div class="col-sm-12">
            <label for="typeF2"
                   class="control-label">
              <span data-translate="" class="control-label-span">metadataTypes</span>
              <input type="text" id="typeF2" value=""
                     class="form-control"
                     gn-values="searchObj.params.type"
                     gn-typeahead="typeOptions"/>
              </label>
          </div>
        </div>
        <div class="form-group">
          <div class="col-sm-12">
            <label for="categoriesF2"
                   class="control-label">
              <span data-translate="" class="control-label-span">categories</span>
              <input type="text" id="categoriesF2" value=""
                     class="form-control"
                     gn-typeahead="categoriesOptions"
                     gn-values="searchObj.params._cat"/>
            </label>
          </div>
        </div>
      </div>
      <div data-ng-show="authenticated && user.isEditorOrMore()">
        <div class="form-group">
          <div class="col-sm-12">
            <label for="sourceCatalogF"
                   class="control-label">
              <span data-translate="" class="control-label-span">sourceCatalog</span>
              <input type="text" id="sourceCatalogF" value=""
                     class="form-control"
                     gn-values="searchObj.params._source"
                     gn-typeahead="sourceCatalogOptions"/>
            </label>
          </div>
        </div>
        <div class="form-group">
          <div class="col-sm-12">
            <label for="metadataTypeF"
                   class="control-label">
              <span data-translate="" class="control-label-span">type</span>
              <input type="text" id="metadataTypeF" value=""
                     class="form-control"
                     gn-values="searchObj.params._isTemplate"
                     gn-typeahead="metadataTypeOptions"/>
            </label>
          </div>
        </div>
        <div class="form-group">
          <div class="col-sm-12">
            <label for="groupsOwnerF"
                   class="control-label">
              <span data-translate="" class="control-label-span">_groupOwner</span>
              <input type="text" id="groupsOwnerF" value=""
                     class="form-control"
                     gn-values="searchObj.params._groupOwner"
                     gn-typeahead="groupOwnerOptions"/>
            </label>
          </div>
        </div>
        <div class="form-group">
          <div class="col-sm-12">
            <label for="mdStatusF"
                   class="control-label">
              <span data-translate="" class="control-label-span">mdStatus</span>
              <input type="text" id="mdStatusF" value=""
                     class="form-control"
                     gn-values="searchObj.params._status"
                     gn-typeahead="mdStatusOptions"/>
            </label>
          </div>
        </div>
        <div class="form-group">
          <div class="col-sm-12" id="myMetadataContainer">
            <label for="myMetadataF"
                   class="control-label"
                   data-translate="">
              <span data-translate="" class="control-label-span">myMetadata</span>
              <input type="checkbox" id="myMetadataF"
                     ng-model="checkbox.isMyMd"
                     ng-change="filterMyMd()"/>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
