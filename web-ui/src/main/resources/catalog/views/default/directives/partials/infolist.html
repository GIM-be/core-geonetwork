<ul class="row gn-info-list">
  <li
    data-ng-repeat="md in searchResults.records"
    gn-metadata-open="md"
    gn-records="searchResults.records"
    gn-formatter="formatter.defaultUrl"
    id="gn-info-list-mw-{{md.getUuid()}}">
    <section class="resultcard clearfix"
             data-ng-class="md.getThumbnails().list[0].url ? 'hasThumbnail' : 'noThumbnail'">

      <div class="title">
        <a href=""
           gn-metadata-open="md"
           gn-records="searchResults.records"
           gn-formatter="formatter.defaultUrl">
          <h4>{{md.title || md.defaultTitle}}&nbsp;</h4>
        </a>
      </div>

      <div class="gn-md-thumbnail">
        <a href=""
           gn-metadata-open="md"
           gn-records="searchResults.records"
           gn-formatter="formatter.defaultUrl">
          <div class="gn-img-thumbnail"
               style="background-image: url({{md.getThumbnails().list[0].url}})">
          </div>
        </a>
      </div>

      <div class="content">
        <div class="abstract">
          {{md.abstract}}
        </div>

        <div class="introduction">
          <span class="badge" data-ng-repeat="t in md.type">{{t | translate}}
          </span>
        </div>
      </div>
      <div data-ng-if="md.mdStatus<50">
        <i class="fa gn-aiv-workflow-status-all gn-aiv-workflow-status-{{(md.mdStatus==2 || md.mdStatus==3) ? 'unlocked' : 'locked'}} gn-aiv-workflow-status-{{(md.mdStatus && md.mdStatus < 7) ? md.mdStatus : 'x'}}">
          <span>{{'mdStatusRecord' | translate}}: {{('mdStatus-' + md.mdStatus) | translate}}</span>
        </i>
      </div>
    </section>
  </li>
</ul>
