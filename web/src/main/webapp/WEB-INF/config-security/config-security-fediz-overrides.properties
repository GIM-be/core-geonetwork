# Map FEDIZ claims to user attributes
fedizClaimsUserMapper.mapping[contactid]=userid
fedizClaimsUserMapper.mapping[name]=username
fedizClaimsUserMapper.mapping[givenname]=name
fedizClaimsUserMapper.mapping[surname]=surname
fedizClaimsUserMapper.mapping[emailaddress]=mail
fedizClaimsUserMapper.mapping[organisationid]=organisationid
fedizClaimsUserMapper.mapping[organisationdisplayname]=organisationdisplayname
fedizClaimsUserMapper.mapping[parentorganisationid]=parentorganisationid
fedizClaimsUserMapper.mapping[parentorganisationdisplayname]=parentorganisationdisplayname
fedizClaimsUserMapper.mapping[role]=profile

fedizClaimsUserMapper.profileKey=profile

# Map FEDIZ roles to user profiles
fedizClaimsUserMapper.profileMapping[AGIV\u0020Metadata\u0020Admin]=Administrator
fedizClaimsUserMapper.profileMapping[AGIV\u0020Metadata\u0020Hoofdeditor]=Reviewer
fedizClaimsUserMapper.profileMapping[AGIV\u0020Metadata\u0020Editor]=Editor
fedizClaimsUserMapper.profileMapping[Geopunt\u0020Metadata\u0020Admin]=Administrator
fedizClaimsUserMapper.profileMapping[Geopunt\u0020Metadata\u0020Hoofdeditor]=Reviewer
fedizClaimsUserMapper.profileMapping[Geopunt\u0020Metadata\u0020Editor]=Editor
fedizClaimsUserMapper.profileMapping[AIV\u0020Metadata\u0020Admin]=Administrator
fedizClaimsUserMapper.profileMapping[AIV\u0020Metadata\u0020Hoofdeditor]=Reviewer
fedizClaimsUserMapper.profileMapping[AIV\u0020Metadata\u0020Editor]=Editor
